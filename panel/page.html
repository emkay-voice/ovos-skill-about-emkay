<style>
  .story { display: grid; gap: 1rem; }
  .story-part { display: grid; grid-template-columns: 6rem 1fr; gap: 1rem; align-items: start; }
  .story-part img { width: 6rem; height: 6rem; object-fit: contain; border-radius: var(--radius-sm); }
  .story-part .no-image { width: 6rem; height: 6rem; display: grid; place-items: center;
    border-radius: var(--radius-sm); background: var(--card-soft); color: var(--muted);
    font-weight: 700; text-align: center; padding: 0.25rem; }
  .story-part h2 { margin-top: 0; }
  @media (max-width: 30rem) { .story-part { grid-template-columns: 1fr; } }
</style>
<p class="hint" data-i18n="aboutEmkay.intro">Who Emkay is, and where it comes from: the story Emkay tells when you ask it about itself.</p>
<section class="card">
  <div class="story" id="story" aria-live="polite">
    <p data-i18n="aboutEmkay.loading">Loading the story…</p>
  </div>
</section>
<div class="msg" id="msg" role="status" aria-live="polite" hidden></div>
<p class="hint"><span data-i18n="aboutEmkay.ask">Ask Emkay "Tell me about yourself" to hear it, with the pictures on the screen.</span></p>
<p class="hint foot"><a data-i18n="aboutEmkay.more" href="https://github.com/emkay-voice/emkay">More about Emkay</a></p>
<script>
OvosWebUI.ready(function () {
  var esc = OvosWebUI.esc, el = OvosWebUI.el;
  OvosWebUI.api("/api/about-emkay/story").then(function (r) {
    el("story").innerHTML = r.parts.map(function (part) {
      var picture = part.image
        ? '<img src="/pages/about-emkay/' + encodeURIComponent(part.image) + '" alt="">'
        : '<div class="no-image" aria-hidden="true">' + esc(part.title) + "</div>";
      return '<article class="story-part">' + picture
        + "<div><h2>" + esc(part.title) + "</h2><p>" + esc(part.text) + "</p></div></article>";
    }).join("");
  }).catch(function (e) {
    el("story").innerHTML = "";
    OvosWebUI.say("msg", OvosWebUI.t("aboutEmkay.error", "The story could not be read.") + " " + e.message, true);
  });
});
</script>
